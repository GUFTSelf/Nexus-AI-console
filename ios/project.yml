name: NexusAI

options:
  bundleIdPrefix: com.gutsdeterministic
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targets:
  NexusAI:
    type: application
    platform: iOS
    sources:
      - NexusAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gutsdeterministic.nexusai
        PRODUCT_NAME: Nexus AI
        CODE_SIGN_STYLE: Automatic
    info:
      path: NexusAI/Info.plist
      properties:
        CFBundleDisplayName: Nexus AI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  NexusAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NexusAITests
    dependencies:
      - target: NexusAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gutsdeterministic.nexusai.tests

schemes:
  NexusAI:
    build:
      targets:
        NexusAI: all
    test:
      targets:
        - NexusAITests
