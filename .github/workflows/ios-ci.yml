name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"] and x["isAvailable"]))')
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test iOS app
        working-directory: ios
        run: >-
          xcodebuild
          -project NexusAI.xcodeproj
          -scheme NexusAI
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"
          CODE_SIGNING_ALLOWED=NO
          test
